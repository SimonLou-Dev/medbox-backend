version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: medbox-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-medbox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medbox_password}
      POSTGRES_DB: ${DB_NAME:-medbox_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medbox-network

  # Redis — broker Celery + result backend
  redis:
    image: redis:7-alpine
    container_name: medbox-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medbox-network

  # FastAPI Application Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: medbox-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-medbox}:${DB_PASSWORD:-medbox_password}@postgres:5432/${DB_NAME:-medbox_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-medbox}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-medbox-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./medbox:/app/medbox
      - ./migrations:/app/migrations
    networks:
      - medbox-network
    restart: unless-stopped

  # IoT Worker — Celery worker sur la queue 'iot'
  # Reçoit les commandes de dispense et traite les événements MQTT
  iot-worker:
    build:
      context: .
      dockerfile: Dockerfile.iotworker
    container_name: medbox-iot-worker
    command: >
      celery -A medbox.iotworker.broker worker
      --loglevel=info -Q iot -c 4 -n iot@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-medbox}:${DB_PASSWORD:-medbox_password}@postgres:5432/${DB_NAME:-medbox_db}
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./medbox:/app/medbox
    networks:
      - medbox-network
    restart: unless-stopped

  # Scheduler Worker — Celery worker sur la queue 'scheduler'
  # Exécute les tâches planifiées : dispatch, monitoring, cleanup
  scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: medbox-scheduler-worker
    command: >
      celery -A medbox.schedulerworker.broker_config worker
      --loglevel=info -Q scheduler -c 2 -n scheduler@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-medbox}:${DB_PASSWORD:-medbox_password}@postgres:5432/${DB_NAME:-medbox_db}
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./medbox:/app/medbox
    networks:
      - medbox-network
    restart: unless-stopped

  # Celery Beat — planificateur des tâches périodiques
  # Un seul Beat doit tourner à la fois (singleton)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: medbox-celery-beat
    command: >
      celery -A medbox.schedulerworker.broker_config beat
      --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-medbox}:${DB_PASSWORD:-medbox_password}@postgres:5432/${DB_NAME:-medbox_db}
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./medbox:/app/medbox
      - celerybeat_data:/app/celerybeat
    networks:
      - medbox-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:

networks:
  medbox-network:
    driver: bridge
